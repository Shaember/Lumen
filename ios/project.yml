name: Lumen
options:
  bundleIdPrefix: com.lumen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - Lumen
    settings:
      base:
        INFOPLIST_FILE: Lumen/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lumen.photos
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
